<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FestPass - Events</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6fb;
            color: #222;
        }

        header {
            background: linear-gradient(135deg, #172554, #2563eb);
            color: white;
            padding: 25px 40px;
        }

        header h1 {
            margin: 0;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        .full {
            grid-column: 1 / 3;
        }

        button {
            border: none;
            padding: 11px 18px;
            border-radius: 7px;
            cursor: pointer;
            color: white;
            font-size: 14px;
        }

        .create-btn {
            background: #1d4ed8;
            margin-top: 20px;
        }

        .create-btn:hover {
            background: #1e40af;
        }

        .event {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .event h3 {
            color: #1d4ed8;
            margin-top: 0;
        }

        .headcount-btn {
            background: #0f766e;
        }

        .delete-btn {
            background: #dc2626;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 7px;
            display: none;
            white-space: pre-wrap;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .back-btn {
            background: #475569;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>🎉 FestPass - Manage Events</h1>
    <p>Create and manage college fest events</p>
</header>

<div class="container">

    <button class="back-btn" onclick="window.location.href='index.html'">
        ← Back to Home
    </button>

    <!-- CREATE EVENT -->
    <div class="card">
        <h2>➕ Create New Event</h2>

        <form id="eventForm">

            <div class="form-grid">

                <div>
                    <label for="name">Event Name</label>
                    <input
                            type="text"
                            id="name"
                            placeholder="Enter event name"
                            required>
                </div>

                <div>
                    <label for="eventDate">Event Date</label>
                    <input
                            type="datetime-local"
                            id="eventDate"
                            required>
                </div>

                <div>
                    <label for="venue">Venue</label>
                    <input
                            type="text"
                            id="venue"
                            placeholder="Enter venue"
                            required>
                </div>

                <div>
                    <label for="capacity">Capacity</label>
                    <input
                            type="number"
                            id="capacity"
                            min="1"
                            placeholder="Enter capacity"
                            required>
                </div>

                <div class="full">
                    <label for="ticketPrice">Ticket Price</label>
                    <input
                            type="number"
                            id="ticketPrice"
                            min="0"
                            step="0.01"
                            placeholder="Enter ticket price"
                            required>
                </div>

            </div>

            <button type="submit" class="create-btn">
                Create Event
            </button>

        </form>

        <div id="message" class="message"></div>
    </div>

    <!-- EXISTING EVENTS -->
    <div class="card">
        <h2>📅 Existing Events</h2>

        <div id="eventsList">
            Loading events...
        </div>
    </div>

</div>

<script>

    // ============================
    // CREATE EVENT
    // ============================

    document.getElementById("eventForm").addEventListener("submit", async function(event) {

        event.preventDefault();

        const message = document.getElementById("message");

        const name = document.getElementById("name").value.trim();
        const eventDate = document.getElementById("eventDate").value;
        const venue = document.getElementById("venue").value.trim();
        const capacity = document.getElementById("capacity").value;
        const ticketPrice = document.getElementById("ticketPrice").value;

        const data = {
            name: name,
            eventDate: eventDate,
            venue: venue,
            capacity: parseInt(capacity),
            ticketPrice: parseFloat(ticketPrice)
        };

        console.log("Sending event data:", data);

        try {

            const response = await fetch(
                window.location.origin + "/api/events",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },
                    body: JSON.stringify(data)
                }
            );

            const responseText = await response.text();

            console.log(
                "Server response:",
                response.status,
                responseText
            );

            if (!response.ok) {

                throw new Error(
                    "Server returned " +
                    response.status +
                    ": " +
                    responseText
                );
            }

            const createdEvent = JSON.parse(responseText);

            message.className = "message success";
            message.style.display = "block";

            message.textContent =
                "✓ Event created successfully!\n" +
                "Event ID: " +
                createdEvent.id;

            document.getElementById("eventForm").reset();

            loadEvents();

        } catch (error) {

            console.error(
                "Create event error:",
                error
            );

            message.className = "message error";
            message.style.display = "block";

            message.textContent =
                "❌ Failed to create event.\n\n" +
                error.message;
        }

    });


    // ============================
    // LOAD EVENTS
    // ============================

    async function loadEvents() {

        const eventsList =
            document.getElementById("eventsList");

        try {

            const response =
                await fetch("/api/events");

            if (!response.ok) {

                throw new Error(
                    "Unable to load events"
                );
            }

            const events =
                await response.json();

            eventsList.innerHTML = "";

            if (events.length === 0) {

                eventsList.innerHTML =
                    "<p>No events available.</p>";

                return;
            }

            events.forEach(event => {

                const eventDiv =
                    document.createElement("div");

                eventDiv.className = "event";

                eventDiv.innerHTML = `

                    <h3>🎉 ${event.name}</h3>

                    <p>
                        <strong>ID:</strong>
                        ${event.id}
                    </p>

                    <p>
                        <strong>Date:</strong>
                        ${event.eventDate}
                    </p>

                    <p>
                        <strong>Venue:</strong>
                        ${event.venue}
                    </p>

                    <p>
                        <strong>Capacity:</strong>
                        ${event.capacity}
                    </p>

                    <p>
                        <strong>Ticket Price:</strong>
                        ₹${event.ticketPrice}
                    </p>

                    <button
                        class="headcount-btn"
                        onclick="viewHeadcount(${event.id})">
                        View Headcount
                    </button>

                    <button
                        class="delete-btn"
                        onclick="deleteEvent(${event.id})">
                        Delete
                    </button>

                    <p id="headcount-${event.id}"></p>
                `;

                eventsList.appendChild(eventDiv);

            });

        } catch (error) {

            console.error(
                "Load events error:",
                error
            );

            eventsList.innerHTML =
                "<p class='error'>" +
                "Unable to load events." +
                "</p>";
        }
    }


    // ============================
    // HEADCOUNT
    // ============================

    async function viewHeadcount(id) {

        try {

            const response =
                await fetch(
                    "/api/events/" +
                    id +
                    "/headcount"
                );

            if (!response.ok) {

                throw new Error(
                    "Unable to get headcount"
                );
            }

            const count =
                await response.json();

            document.getElementById(
                "headcount-" + id
            ).innerHTML =
                "<strong>Current Headcount:</strong> " +
                count;

        } catch (error) {

            console.error(
                "Headcount error:",
                error
            );

            alert(
                "Unable to get headcount."
            );
        }
    }


    // ============================
    // DELETE EVENT
    // ============================

    async function deleteEvent(id) {

        if (
            !confirm(
                "Are you sure you want to delete this event?"
            )
        ) {
            return;
        }

        try {

            const response =
                await fetch(
                    "/api/events/" + id,
                    {
                        method: "DELETE"
                    }
                );

            if (!response.ok) {

                throw new Error(
                    "Unable to delete event"
                );
            }

            alert(
                "Event deleted successfully!"
            );

            loadEvents();

        } catch (error) {

            console.error(
                "Delete event error:",
                error
            );

            alert(
                "Failed to delete event."
            );
        }
    }


    // ============================
    // LOAD EVENTS WHEN PAGE OPENS
    // ============================

    loadEvents();

</script>

</body>
</html>
