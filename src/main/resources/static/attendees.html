<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FestPass - Attendees</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            color: #222;
        }

        header {
            background: #1e3a8a;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 26px;
        }

        .container {
            padding: 40px;
            max-width: 1100px;
            margin: auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .top-bar h2 {
            color: #1e3a8a;
        }

        .button {
            display: inline-block;
            padding: 10px 18px;
            background: #1e3a8a;
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .button:hover {
            background: #162d6b;
        }

        .form-card,
        .attendees-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
            margin-bottom: 25px;
        }

        .form-card h3,
        .attendees-card h3 {
            margin-bottom: 20px;
            color: #1e3a8a;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
        }

        .form-group label {
            margin-bottom: 6px;
            font-weight: bold;
        }

        .form-group input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            display: none;
        }

        .success {
            background: #d1fae5;
            color: #065f46;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .attendee {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .attendee h4 {
            color: #1e3a8a;
            margin-bottom: 10px;
        }

        .attendee p {
            margin: 6px 0;
        }

        .delete-button {
            background: #dc2626;
            margin-top: 10px;
        }

        .delete-button:hover {
            background: #b91c1c;
        }

        @media (max-width: 700px) {

            .container {
                padding: 20px;
            }

            .top-bar {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
        }
    </style>

</head>

<body>

<header>
    <h1>🎟️ FestPass</h1>
    <span>Attendee Management</span>
</header>

<div class="container">

    <div class="top-bar">

        <h2>Manage Attendees</h2>

        <a href="/index.html" class="button">
            ← Back to Home
        </a>

    </div>


    <div class="form-card">

        <h3>Register New Attendee</h3>

        <div class="form-group">

            <label>Name</label>

            <input
                    type="text"
                    id="name"
                    placeholder="Enter attendee name">

        </div>


        <div class="form-group">

            <label>Email</label>

            <input
                    type="email"
                    id="email"
                    placeholder="Enter email address">

        </div>


        <div class="form-group">

            <label>Phone</label>

            <input
                    type="text"
                    id="phone"
                    placeholder="Enter phone number">

        </div>


        <button
                class="button"
                onclick="createAttendee()">

            Register Attendee

        </button>


        <div
                id="message"
                class="message">
        </div>

    </div>


    <div class="attendees-card">

        <h3>Registered Attendees</h3>

        <div id="attendeesList">
            Loading attendees...
        </div>

    </div>

</div>


<script>

    function showMessage(message, type) {

        const box =
            document.getElementById("message");

        box.innerText = message;

        box.className =
            "message " + type;

        box.style.display = "block";
    }


    async function createAttendee() {

        const name =
            document.getElementById("name").value;

        const email =
            document.getElementById("email").value;

        const phone =
            document.getElementById("phone").value;


        if (!name || !email || !phone) {

            showMessage(
                "Please fill all fields.",
                "error"
            );

            return;
        }


        const data = {

            name: name,

            email: email,

            phone: phone

        };


        try {

            const response =
                await fetch("/api/attendees", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(data)

                });


            if (!response.ok) {

                const errorData =
                    await response.json();

                showMessage(
                    errorData.message ||
                    "Failed to register attendee.",
                    "error"
                );

                return;
            }


            showMessage(
                "Attendee registered successfully!",
                "success"
            );


            document.getElementById("name").value = "";
            document.getElementById("email").value = "";
            document.getElementById("phone").value = "";


            loadAttendees();

        }

        catch (error) {

            showMessage(
                "Unable to connect to the server.",
                "error"
            );

        }

    }


    async function loadAttendees() {

        const list =
            document.getElementById("attendeesList");


        try {

            const response =
                await fetch("/api/attendees");


            if (!response.ok) {

                list.innerHTML =
                    "<p>Unable to load attendees.</p>";

                return;
            }


            const attendees =
                await response.json();


            if (attendees.length === 0) {

                list.innerHTML =
                    "<p>No attendees registered yet.</p>";

                return;
            }


            list.innerHTML = "";


            attendees.forEach(attendee => {

                const div =
                    document.createElement("div");

                div.className = "attendee";


                div.innerHTML = `

                    <h4>👤 ${attendee.name}</h4>

                    <p>
                        <strong>ID:</strong>
                        ${attendee.id}
                    </p>

                    <p>
                        <strong>Email:</strong>
                        ${attendee.email}
                    </p>

                    <p>
                        <strong>Phone:</strong>
                        ${attendee.phone}
                    </p>

                    <button
                        class="button delete-button"
                        onclick="deleteAttendee(${attendee.id})">

                        Delete

                    </button>

                `;


                list.appendChild(div);

            });

        }

        catch (error) {

            list.innerHTML =
                "<p>Unable to connect to the server.</p>";

        }

    }


    async function deleteAttendee(id) {

        if (!confirm(
            "Are you sure you want to delete this attendee?"
        )) {

            return;
        }


        try {

            const response =
                await fetch(
                    `/api/attendees/${id}`,
                    {
                        method: "DELETE"
                    }
                );


            if (response.status === 204) {

                alert(
                    "Attendee deleted successfully."
                );

                loadAttendees();

            }

            else {

                const errorData =
                    await response.json();

                alert(
                    errorData.message ||
                    "Unable to delete attendee."
                );

            }

        }

        catch (error) {

            alert(
                "Unable to connect to the server."
            );

        }

    }


    loadAttendees();

</script>

</body>

</html>
